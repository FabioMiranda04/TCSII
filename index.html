<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mega cursos</title>
    <!-- Google Fonts: Plus Jakarta Sans & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome v6.4.2 for navigation/close icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- Bootstrap Icons for page icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom Style -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Header / Top Navbar -->
    <header class="main-header">
        <div class="header-left">
            <button id="sidebar-toggle" class="btn-icon" aria-label="Abrir Menu">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
        
        <div class="header-center">
            <a href="#" class="logo-container">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <div class="logo-text">
                    <span class="logo-name">mega <strong>cursos</strong></span>
                </div>
            </a>
        </div>

        <div class="header-right">
            <!-- Blank / Removed Julio Di Franco profile to keep layout very simple -->
        </div>
    </header>

    <!-- Sub-navigation / Horizontal Menu Tabs -->
    <nav class="sub-navbar">
        <div class="tabs-container">
            <button class="nav-tab active" data-tab="trilhas">Trilhas</button>
            <button class="nav-tab" data-tab="cursos">Cursos</button>
            <button class="nav-tab" data-tab="modulos">Módulos</button>
            <button class="nav-tab" data-tab="aulas">Aulas</button>
            <button class="nav-tab" data-tab="usuarios">Usuários</button>
            <button class="nav-tab" data-tab="assinaturas">Assinaturas</button>
            <button class="nav-tab" data-tab="certificados">Certificados</button>
        </div>
    </nav>

    <!-- Slide-out Sidebar / JavaScript Toggle Sidemenu -->
    <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <a href="#" class="logo-container">
                <div class="logo-icon purple">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <div class="logo-text">
                    <span class="logo-name">mega <strong>cursos</strong></span>
                </div>
            </a>
            <button id="sidebar-close" class="btn-icon" aria-label="Fechar Menu">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        
        <nav class="sidebar-nav">
            <div class="sidebar-group">
                <ul>
                    <li>
                        <button class="sidebar-link active" data-sidebar-tab="trilhas">
                            <i class="bi bi-compass"></i>
                            <span>Trilhas</span>
                        </button>
                    </li>
                    <li>
                        <button class="sidebar-link" data-sidebar-tab="cursos">
                            <i class="bi bi-journal-bookmark-fill"></i>
                            <span>Cursos</span>
                        </button>
                    </li>
                    <li>
                        <button class="sidebar-link" data-sidebar-tab="modulos">
                            <i class="bi bi-columns-gap"></i>
                            <span>Módulos</span>
                        </button>
                    </li>
                    <li>
                        <button class="sidebar-link" data-sidebar-tab="aulas">
                            <i class="bi bi-play-circle"></i>
                            <span>Aulas</span>
                        </button>
                    </li>
                    <li>
                        <button class="sidebar-link" data-sidebar-tab="usuarios">
                            <i class="bi bi-people"></i>
                            <span>Usuários</span>
                        </button>
                    </li>
                    <li>
                        <button class="sidebar-link" data-sidebar-tab="assinaturas">
                            <i class="bi bi-card-checklist"></i>
                            <span>Assinaturas</span>
                        </button>
                    </li>
                    <li>
                        <button class="sidebar-link" data-sidebar-tab="certificados">
                            <i class="bi bi-patch-check"></i>
                            <span>Certificados</span>
                        </button>
                    </li>
                </ul>
            </div>
        </nav>
    </aside>

    <!-- Overlay backdrop for sidebar -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- Main Content Area -->
    <main class="main-content">
        <div class="content-container">
            <h1 id="active-tab-title">Trilhas</h1>
        </div>
    </main>

    <!-- Script File -->
    <script src="script.js"></script>
</body>
</html>
